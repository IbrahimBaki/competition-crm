<VirtualHost *:80>
    ServerName competition-crm.azmsquad.localhost
    DocumentRoot /var/www/html/competition-crm/public

    <Directory /var/www/html/competition-crm/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/competition-crm-error.log
    CustomLog ${APACHE_LOG_DIR}/competition-crm-access.log combined
</VirtualHost>

# SPA vhost (FE-01: Story 478)
# Serves the React SPA from frontend/dist
# Domain split: API stays at <subdomain>, SPA on app.<subdomain>
<VirtualHost *:80>
    ServerName app.support-crm.localhost
    DocumentRoot /var/www/html/competition-crm/frontend/dist

    <Directory /var/www/html/competition-crm/frontend/dist>
        AllowOverride All
        Require all granted

        # SPA history mode: all requests to existing files/dirs as-is,
        # everything else gets routed to index.html for client-side routing
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
        </IfModule>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/spa-error.log
    CustomLog ${APACHE_LOG_DIR}/spa-access.log combined
</VirtualHost>
