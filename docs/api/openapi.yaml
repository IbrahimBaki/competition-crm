openapi: 3.1.0
info:
  title: Support CRM API
  version: 1.0.0
  description: Support CRM platform API with integrated automation, reporting, and external integrations

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.support.example.com/api/v1
    description: Production

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff session token (via auth/login)
    portalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Portal account token (via portal/auth/login)
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: Integration API token (machine-to-machine via api-tokens)

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
      description: Page number for pagination
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Items per page
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Sort field and direction (e.g., "created_at,-updated_at")
    Filter:
      name: filter
      in: query
      style: deepObject
      schema:
        type: object
      description: Filter parameters (nested object)
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        format: uuid
      description: Idempotency key for write operations
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum: [en, ar]
      description: Requested language

  schemas:
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    BilingualString:
      type: object
      properties:
        en:
          type: string
        ar:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - TOO_MANY_REQUESTS
                - INTERNAL_SERVER_ERROR
                - SERVICE_UNAVAILABLE
            message:
              type: string
            request_id:
              type: string
              format: uuid
            field_errors:
              type: [object, 'null']
              additionalProperties:
                type: array
                items:
                  type: string
            meta:
              type: [object, 'null']

    ApiTokenResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token_prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        last_used_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    IssuedApiTokenResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: Plaintext token - returned once only
        token_prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    CollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

    SlaTarget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        target_type:
          type: string
          enum: [first_response, resolution]
        priority:
          type: string
        category_id:
          type: [string, 'null']
          format: uuid
        service_tier:
          type: [string, 'null']
        minutes:
          type: integer
          description: Target in WORKING minutes, not wall-clock minutes
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SlaPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/BilingualString'
        is_default:
          type: boolean
        is_active:
          type: boolean
        warning_threshold_percent:
          type: integer
        targets:
          type: array
          items:
            $ref: '#/components/schemas/SlaTarget'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SlaPolicyWrite:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/BilingualString'
        targets:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              type:
                type: string
                enum: [first_response, resolution]
              minutes:
                type: integer
                minimum: 1
            required: [type, minutes]
      required: [name, targets]

    TicketSlaPosition:
      type: object
      description: Server-computed business-time position of one SLA clock.
      properties:
        target_type:
          type: string
          enum: [first_response, resolution]
        state:
          type: string
        due_at:
          type: [string, 'null']
          format: date-time
        target_minutes:
          type: integer
        elapsed_minutes:
          type: integer
        remaining_minutes:
          type: integer
        warning_fired:
          type: boolean
        paused_at:
          type: [string, 'null']
          format: date-time

    AiSuggestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: [string, 'null']
          format: uuid
        feature:
          type: string
        state:
          type: string
          enum: [pending, accepted, discarded, sent]
        content:
          type: string
        confidence:
          type: [number, 'null']
          format: float
        model:
          type: string
        requested_by_user_id:
          type: [string, 'null']
          format: uuid
        resolved_by_user_id:
          type: [string, 'null']
          format: uuid
        resolved_at:
          type: [string, 'null']
          format: date-time
        metadata:
          type: [object, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReportSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        report_key:
          type: string
        format:
          type: string
          enum: [csv, xlsx, pdf]
        filters:
          type: object
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        day_of_week:
          type: [integer, 'null']
        day_of_month:
          type: [integer, 'null']
        run_at_time:
          type: string
        timezone:
          type: string
        recipients:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_by_user_id:
          type: [string, 'null']
          format: uuid
        last_run_at:
          type: [string, 'null']
          format: date-time
        next_run_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReportScheduleWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        report_key:
          type: string
        format:
          type: string
          enum: [csv, xlsx, pdf]
        filters:
          type: object
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        day_of_week:
          type: [integer, 'null']
          minimum: 0
          maximum: 6
          description: Required when frequency is weekly
        day_of_month:
          type: [integer, 'null']
          minimum: 1
          maximum: 31
          description: Required when frequency is monthly
        run_at_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
        timezone:
          type: string
        recipients:
          type: array
          minItems: 1
          items:
            type: string
        is_active:
          type: boolean

    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        target_url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookSubscriptionWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        target_url:
          type: string
          format: uri
          description: Must be an https:// URL
        event_types:
          type: array
          minItems: 1
          items:
            type: string
        is_active:
          type: boolean

    AutomationRuleWrite:
      type: object
      description: >-
        Condition/action payloads follow docs/contracts/automation-rules.md.
        `key` is immutable-by-convention and unique across rules.
      properties:
        key:
          type: string
          pattern: '^[a-z0-9-]+$'
        name:
          $ref: '#/components/schemas/BilingualString'
        trigger:
          type: string
        priority:
          type: integer
          minimum: 0
          maximum: 1000
        department_id:
          type: [string, 'null']
          format: uuid
        conditions:
          type: array
          items:
            type: object
        actions:
          type: array
          items:
            type: object
        escalation_level:
          type: [integer, 'null']
          minimum: 1
        cooldown_minutes:
          type: [integer, 'null']
          minimum: 1
        stop_on_match:
          type: boolean
        is_active:
          type: boolean

    ImportRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        mode:
          type: string
          enum: [dry_run, commit]
        state:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  # ==================== Security & Authentication ====================

  /auth/login:
    post:
      tags: [Security]
      operationId: postAuthLogin
      summary: Staff login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        type: object

  /auth/logout:
    post:
      tags: [Security]
      operationId: postAuthLogout
      summary: Staff logout
      security:
        - bearer: []
      responses:
        '204':
          description: Logout successful

  /auth/me:
    get:
      tags: [Security]
      operationId: getAuthMe
      summary: Get current user
      security:
        - bearer: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  /auth/two-factor/challenge:
    post:
      tags: [Security]
      operationId: postAuthTwoFactorChallenge
      summary: Submit 2FA challenge code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required: [code]
      responses:
        '200':
          description: Challenge passed
          content:
            application/json:
              schema:
                type: object

  /auth/two-factor:
    post:
      tags: [Security]
      operationId: postAuthTwoFactor
      summary: Enable 2FA
      security:
        - bearer: []
      responses:
        '200':
          description: 2FA enabled
          content:
            application/json:
              schema:
                type: object

    delete:
      tags: [Security]
      operationId: deleteAuthTwoFactor
      summary: Disable 2FA
      security:
        - bearer: []
      responses:
        '204':
          description: 2FA disabled

  /auth/two-factor/confirm:
    post:
      tags: [Security]
      operationId: postAuthTwoFactorConfirm
      summary: Confirm 2FA setup
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required: [code]
      responses:
        '200':
          description: 2FA confirmed
          content:
            application/json:
              schema:
                type: object

  /auth/two-factor/recovery-codes:
    post:
      tags: [Security]
      operationId: postAuthTwoFactorRecoveryCodes
      summary: Generate recovery codes
      security:
        - bearer: []
      responses:
        '200':
          description: Recovery codes generated
          content:
            application/json:
              schema:
                type: object

  /auth/password/forgot:
    post:
      tags: [Security]
      operationId: postAuthPasswordForgot
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        '200':
          description: Reset email sent

  /auth/password/reset:
    post:
      tags: [Security]
      operationId: postAuthPasswordReset
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [token, email, password]
      responses:
        '200':
          description: Password reset

  /auth/policy:
    get:
      tags: [Security]
      operationId: getAuthPolicy
      summary: Get authentication policy
      security:
        - bearer: []
      responses:
        '200':
          description: Authentication policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

    put:
      tags: [Security]
      operationId: putAuthPolicy
      summary: Update authentication policy
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Policy updated

  /permissions/catalogue:
    get:
      tags: [Security]
      operationId: getPermissionsCatalogue
      summary: List all permissions
      security:
        - bearer: []
      responses:
        '200':
          description: Permission catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /roles:
    get:
      tags: [Security]
      operationId: getRoles
      summary: List roles
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Roles list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'

    post:
      tags: [Security]
      operationId: postRoles
      summary: Create role
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/BilingualString'
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  /roles/{role}:
    get:
      tags: [Security]
      operationId: getRole
      summary: Get role details
      security:
        - bearer: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

    put:
      tags: [Security]
      operationId: putRole
      summary: Update role
      security:
        - bearer: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Role updated

    delete:
      tags: [Security]
      operationId: deleteRole
      summary: Delete role
      security:
        - bearer: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Role deleted

    patch:
      tags: [Security]
      operationId: patchRole
      summary: Update role
      description: >-
        PATCH and PUT share one handler and one validator, so this is NOT a
        partial update: `display_name` and `permission_keys` are both required
        and `permission_keys` replaces the role's permissions wholesale.
      security:
        - bearer: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  $ref: '#/components/schemas/BilingualString'
                permission_keys:
                  type: array
                  items:
                    type: string
              required: [display_name, permission_keys]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: System roles are immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /roles/{role}/users/{user}:
    post:
      tags: [Security]
      operationId: postRoleAttachUser
      summary: Attach user to role
      security:
        - bearer: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User attached

    delete:
      tags: [Security]
      operationId: deleteRoleDetachUser
      summary: Detach user from role
      security:
        - bearer: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User detached

  /users:
    get:
      tags: [Security]
      operationId: getUsers
      summary: List users
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Users list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'

  /users/invite:
    post:
      tags: [Security]
      operationId: postUsersInvite
      summary: Invite new user
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                roles:
                  type: array
                  items:
                    type: string
              required: [email]
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  /users/{user}/activate:
    post:
      tags: [Security]
      operationId: postUserActivate
      summary: Activate user
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User activated

  /users/{user}/deactivate:
    post:
      tags: [Security]
      operationId: postUserDeactivate
      summary: Deactivate user
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deactivated

  /users/{user}/erase-personal-data:
    post:
      tags: [Security]
      operationId: postUserErasePersonalData
      summary: Erase user personal data
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Data erased

  /users/{user}/branches/{branch}:
    post:
      tags: [Security]
      operationId: postUserAttachBranch
      summary: Attach user to branch
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User attached

    delete:
      tags: [Security]
      operationId: deleteUserDetachBranch
      summary: Detach user from branch
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User detached

  /users/{user}/branches/{branch}/primary:
    post:
      tags: [Security]
      operationId: postUserSetPrimaryBranch
      summary: Set primary branch
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Primary branch set

  /users/{user}/departments/{department}:
    post:
      tags: [Security]
      operationId: postUserAttachDepartment
      summary: Attach user to department
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: department
          in: path
          required: true
          schema:
