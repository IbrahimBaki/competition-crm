openapi: 3.1.0
info:
  title: Support CRM API
  version: 1.0.0
  description: Support CRM platform API with integrated automation, reporting, and external integrations

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.support.example.com/api/v1
    description: Production

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff session token (via auth/login)
    portalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Portal account token (via portal/auth/login)
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: Integration API token (machine-to-machine via api-tokens)

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
      description: Page number for pagination
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Items per page
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Sort field and direction (e.g., "created_at,-updated_at")
    Filter:
      name: filter
      in: query
      style: deepObject
      schema:
        type: object
      description: Filter parameters (nested object)
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        format: uuid
      description: Idempotency key for write operations
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum: [en, ar]
      description: Requested language

  schemas:
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    BilingualString:
      type: object
      properties:
        en:
          type: string
        ar:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - TOO_MANY_REQUESTS
                - INTERNAL_SERVER_ERROR
                - SERVICE_UNAVAILABLE
            message:
              type: string
            request_id:
              type: string
              format: uuid
            field_errors:
              type: [object, 'null']
              additionalProperties:
                type: array
                items:
                  type: string
            meta:
              type: [object, 'null']

    ApiTokenResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token_prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        last_used_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    IssuedApiTokenResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: Plaintext token - returned once only
        token_prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    CollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  # ==================== Security & Authentication ====================

  /auth/login:
    post:
      tags: [Security]
      operationId: postAuthLogin
      summary: Staff login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        type: object

  /auth/logout:
    post:
      tags: [Security]
      operationId: postAuthLogout
      summary: Staff logout
      security:
        - bearer: []
      responses:
        '204':
          description: Logout successful

  /auth/me:
    get:
      tags: [Security]
      operationId: getAuthMe
      summary: Get current user
      security:
        - bearer: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  /auth/two-factor/challenge:
    post:
      tags: [Security]
      operationId: postAuthTwoFactorChallenge
      summary: Submit 2FA challenge code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required: [code]
      responses:
        '200':
          description: Challenge passed
          content:
            application/json:
              schema:
                type: object

  /auth/two-factor:
    post:
      tags: [Security]
      operationId: postAuthTwoFactor
      summary: Enable 2FA
      security:
        - bearer: []
      responses:
        '200':
          description: 2FA enabled
          content:
            application/json:
              schema:
                type: object

    delete:
      tags: [Security]
      operationId: deleteAuthTwoFactor
      summary: Disable 2FA
      security:
        - bearer: []
      responses:
        '204':
          description: 2FA disabled

  /auth/two-factor/confirm:
    post:
      tags: [Security]
      operationId: postAuthTwoFactorConfirm
      summary: Confirm 2FA setup
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required: [code]
      responses:
        '200':
          description: 2FA confirmed
          content:
            application/json:
              schema:
                type: object

  /auth/two-factor/recovery-codes:
    post:
      tags: [Security]
      operationId: postAuthTwoFactorRecoveryCodes
      summary: Generate recovery codes
      security:
        - bearer: []
      responses:
        '200':
          description: Recovery codes generated
          content:
            application/json:
              schema:
                type: object

  /auth/password/forgot:
    post:
      tags: [Security]
      operationId: postAuthPasswordForgot
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        '200':
          description: Reset email sent

  /auth/password/reset:
    post:
      tags: [Security]
      operationId: postAuthPasswordReset
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [token, email, password]
      responses:
        '200':
          description: Password reset

  /auth/policy:
    get:
      tags: [Security]
      operationId: getAuthPolicy
      summary: Get authentication policy
      security:
        - bearer: []
      responses:
        '200':
          description: Authentication policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

    put:
      tags: [Security]
      operationId: putAuthPolicy
      summary: Update authentication policy
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Policy updated

  /permissions/catalogue:
    get:
      tags: [Security]
      operationId: getPermissionsCatalogue
      summary: List all permissions
      security:
        - bearer: []
      responses:
        '200':
          description: Permission catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /roles:
    get:
      tags: [Security]
      operationId: getRoles
      summary: List roles
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Roles list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'

    post:
      tags: [Security]
      operationId: postRoles
      summary: Create role
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/BilingualString'
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  /roles/{role}:
    get:
      tags: [Security]
      operationId: getRole
      summary: Get role details
      security:
        - bearer: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

    put:
      tags: [Security]
      operationId: putRole
      summary: Update role
      security:
        - bearer: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Role updated

    delete:
      tags: [Security]
      operationId: deleteRole
      summary: Delete role
      security:
        - bearer: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Role deleted

  /roles/{role}/users/{user}:
    post:
      tags: [Security]
      operationId: postRoleAttachUser
      summary: Attach user to role
      security:
        - bearer: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User attached

    delete:
      tags: [Security]
      operationId: deleteRoleDetachUser
      summary: Detach user from role
      security:
        - bearer: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User detached

  /users:
    get:
      tags: [Security]
      operationId: getUsers
      summary: List users
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Users list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'

  /users/invite:
    post:
      tags: [Security]
      operationId: postUsersInvite
      summary: Invite new user
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                roles:
                  type: array
                  items:
                    type: string
              required: [email]
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  /users/{user}/activate:
    post:
      tags: [Security]
      operationId: postUserActivate
      summary: Activate user
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User activated

  /users/{user}/deactivate:
    post:
      tags: [Security]
      operationId: postUserDeactivate
      summary: Deactivate user
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deactivated

  /users/{user}/erase-personal-data:
    post:
      tags: [Security]
      operationId: postUserErasePersonalData
      summary: Erase user personal data
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Data erased

  /users/{user}/branches/{branch}:
    post:
      tags: [Security]
      operationId: postUserAttachBranch
      summary: Attach user to branch
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User attached

    delete:
      tags: [Security]
      operationId: deleteUserDetachBranch
      summary: Detach user from branch
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User detached

  /users/{user}/branches/{branch}/primary:
    post:
      tags: [Security]
      operationId: postUserSetPrimaryBranch
      summary: Set primary branch
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Primary branch set

  /users/{user}/departments/{department}:
    post:
      tags: [Security]
      operationId: postUserAttachDepartment
      summary: Attach user to department
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: department
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User attached

    delete:
      tags: [Security]
      operationId: deleteUserDetachDepartment
      summary: Detach user from department
      security:
        - bearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: department
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User detached

  /invitations/{token}/accept:
    post:
      tags: [Security]
      operationId: postInvitationAccept
      summary: Accept user invitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                password:
                  type: string
              required: [name, password]
      responses:
        '200':
          description: Invitation accepted

  /audit-logs:
    get:
      tags: [Security]
      operationId: getAuditLogs
      summary: List audit logs
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'

  /data-protection/retention:
    get:
      tags: [Security]
      operationId: getDataProtectionRetention
      summary: Get data retention policy
      security:
        - bearer: []
      responses:
        '200':
          description: Retention policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  # ==================== Organization ====================

  /branches:
    get:
      tags: [Organization]
      operationId: getBranches
      summary: List branches
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Branches list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'

    post:
      tags: [Organization]
      operationId: postBranches
      summary: Create branch
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/BilingualString'
                timezone:
                  type: string
              required: [name, timezone]
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  /branches/{branch}:
    get:
      tags: [Organization]
      operationId: getBranch
      summary: Get branch details
      security:
        - bearer: []
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Branch details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

    put:
      tags: [Organization]
      operationId: putBranch
      summary: Update branch
      security:
        - bearer: []
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Branch updated

    delete:
      tags: [Organization]
      operationId: deleteBranch
      summary: Delete branch
      security:
        - bearer: []
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Branch deleted

  /branches/{branch}/activate:
    post:
      tags: [Organization]
      operationId: postBranchActivate
      summary: Activate branch
      security:
        - bearer: []
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Branch activated

  /branches/{branch}/deactivate:
    post:
      tags: [Organization]
      operationId: postBranchDeactivate
      summary: Deactivate branch
      security:
        - bearer: []
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Branch deactivated

  /branches/{branch}/working-hours:
    get:
      tags: [Organization]
      operationId: getBranchWorkingHours
      summary: Get branch working hours
      security:
        - bearer: []
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Working hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array

    put:
      tags: [Organization]
      operationId: putBranchWorkingHours
      summary: Update working hours
      security:
        - bearer: []
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Working hours updated

  /branches/{branch}/holidays:
    get:
      tags: [Organization]
      operationId: getBranchHolidays
      summary: List branch holidays
      security:
        - bearer: []
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Holidays list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'

    post:
      tags: [Organization]
      operationId: postBranchHolidays
      summary: Create holiday
      security:
        - bearer: []
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                date:
                  type: string
                  format: date
              required: [name, date]
      responses:
        '201':
          description: Holiday created

  /branches/{branch}/holidays/{holiday}:
    put:
      tags: [Organization]
      operationId: putBranchHoliday
      summary: Update holiday
      security:
        - bearer: []
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: holiday
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Holiday updated

    delete:
      tags: [Organization]
      operationId: deleteBranchHoliday
      summary: Delete holiday
      security:
        - bearer: []
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: holiday
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Holiday deleted

  /departments:
    get:
      tags: [Organization]
