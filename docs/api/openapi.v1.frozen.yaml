          description: API tokens list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiTokenResponse'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'

    post:
      tags: [Integrations]
      operationId: postIntegrationTokens
      summary: Issue new API token
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - tickets.read
                      - tickets.write
                      - customers.read
                      - knowledge.read
                      - reports.read
                      - webhooks.manage
                expires_at:
                  type: [string, 'null']
                  format: date-time
              required: [name, scopes]
      responses:
        '201':
          description: Token issued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IssuedApiTokenResponse'

